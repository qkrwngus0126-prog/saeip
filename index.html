<body class="app">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- 로고: 위와 오른쪽 잎을 이으면 3, 왼쪽 잎은 웃는 입 -->

    </symbol>
  </defs>
</svg>

<main class="field" id="field">
  <canvas role="img" data-i18n-attr="aria-label:canvas" aria-label="화면보다 넓은 네잎클로버 들판. 그 아래 사람들이 적어 둔 세잎클로버와 빈 세잎클로버가 숨어 있습니다. 화살표 키로 둘러보고, 하나 보여 주기 버튼으로도 찾을 수 있습니다."></canvas>
  <noscript><p>이 들판은 스크립트가 켜져 있을 때 헤집을 수 있어요. · This meadow needs JavaScript. · この野原には JavaScript が必要です。</p></noscript>
  <!-- 시간대에 따라 들판 위에 비치는 빛: 색을 입히는 층, 빛을 더하는 층, 밤의 반딧불이 -->
  <div class="sky" aria-hidden="true"><div class="tint"></div><div class="light"></div><canvas class="flies" id="flies"></canvas></div>

  <header class="top">
    <a class="wordmark" href="./"><svg viewBox="0 0 20 20" aria-hidden="true"><use href="#mark"/></svg><span data-i18n="brand">saeip</span></a>
    <nav class="menu" aria-label="주요 메뉴">
      <button type="button" id="nav-write" data-i18n="navWrite">행복 적기</button>
      <button type="button" id="nav-mine" data-i18n="navMine">내 기록</button>
      <button type="button" id="nav-auth" data-i18n="login">로그인</button>
      <button type="button" id="nav-lang" class="lang-btn" data-i18n-attr="aria-label:language;title:language" aria-label="언어"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="M2.8 10h14.4M10 2.8c2.2 2.1 3.2 4.5 3.2 7.2s-1 5.1-3.2 7.2M10 2.8C7.8 4.9 6.8 7.3 6.8 10s1 5.1 3.2 7.2"/></svg></button>
    </nav>
  </header>

  <aside class="intro" id="intro" aria-labelledby="intro-title">
    <h1 id="intro-title" data-i18n-lines="introTitle">행운을 찾다 지나친 행복을 <br>같이 적어 둡니다</h1>
    <p data-i18n-lines="introBody">들판은 온통 네잎클로버예요.<br>
      흰 꽃이 핀 곳엔 누군가 적어 둔 행복이 있고,<br>
      꽃이 없는 곳 아래엔 빈 세잎이 숨어 있어요.<br>
      헤집어 찾아서 내 행복을 심어 주세요.</p>
    <div class="row intro-actions">
      <button type="button" class="btn small primary" id="intro-close" data-i18n="introGo">세잎클로버 찾아보기</button>
      <button type="button" class="btn link intro-snooze" id="intro-snooze" data-i18n="introSnooze">하루 동안 보지 않기</button>
    </div>
    <span class="intro-langs" id="intro-langs"></span>
  </aside>

  <section class="feed" id="feed" aria-labelledby="feed-title" hidden>
    <div class="feed-head">
      <h2 class="feed-title" id="feed-title" data-i18n="feedTitle">들판에 적힌 행복</h2>
      <button class="feed-x" id="feed-close" type="button" data-i18n-attr="aria-label:feedClose" aria-label="목록 닫기">×</button>
    </div>
    <ul class="feed-list" id="feed-list"></ul>
  </section>
  <button class="feed-open" id="feed-open" type="button" data-i18n="feedTitle" hidden>들판에 적힌 행복</button>

  <p class="loading" id="loading" role="status" data-i18n="spreading">들판을 펼치는 중…</p>

  <p class="demo-note" id="demo-note" data-i18n="demoNote" hidden>미리보기예요 · config.js를 채우면 실제로 저장돼요</p>

  <div class="field-bar">
    <button class="help-btn" id="help-btn" type="button" data-i18n-attr="aria-label:help" aria-label="이렇게 써요">?</button>
    <span class="count" aria-live="polite"><span class="count-label"><span data-i18n="found">찾은 세잎</span> </span><b id="found-n">0</b> / <span id="total-n">0</span></span>
    <span class="hint-row">
      <span class="hint-text" id="hint-text"></span>
      <button class="hint-btn is-open" id="open-btn" type="button" data-i18n="open" hidden>열어 보기</button>
      <button class="hint-btn" id="hint-btn" type="button" data-i18n="showOne">하나 보여 주기</button>
    </span>
  </div>
</main>

<!-- 모든 창(읽기, 적기, 로그인, 내 기록, 도움말)은 이 하나의 대화상자 안에 그려집니다 -->
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-body" id="sheet-body"></div>
</dialog>
