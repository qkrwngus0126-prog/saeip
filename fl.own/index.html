<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fl.own 꽃다발</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="꽃을 한 송이씩 골라 담고, 포장지와 리본을 고르고, 카드 한 줄을 적어 나만의 3D 꽃다발을 만들어요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <header class="brand">
      <h1>fl.own</h1>
      <p>꽃 한 송이부터, 나만의 꽃다발</p>
    </header>
    <p class="stems"><b id="total">0</b><span>송이</span></p>
    <div class="picked" id="picked" hidden>
      <span class="dot" id="pickedDot"></span>
      <span id="pickedText"></span>
      <button class="link" id="removeOne" type="button">빼기</button>
    </div>
    <div class="tag" id="tag">
      <p class="to" id="tagTo"></p>
      <p class="msg" id="tagMsg"></p>
      <p class="from" id="tagFrom"></p>
    </div>
    <p class="hint">드래그해서 돌려 보고, 꽃을 누르면 골라져요</p>
  </main>

  <aside class="panel">
    <nav class="tabs" role="tablist" aria-label="꽃다발 만들기 단계">
      <button role="tab" id="tab-flowers" aria-controls="pane-flowers" aria-selected="true" type="button">꽃</button>
      <button role="tab" id="tab-wrap" aria-controls="pane-wrap" aria-selected="false" type="button">포장</button>
      <button role="tab" id="tab-card" aria-controls="pane-card" aria-selected="false" type="button">카드</button>
      <button role="tab" id="tab-saved" aria-controls="pane-saved" aria-selected="false" type="button">보관함</button>
    </nav>

    <div class="panes">
      <section class="pane" id="pane-flowers" role="tabpanel" aria-labelledby="tab-flowers">
        <ul class="menu" id="flowers"></ul>
      </section>

      <section class="pane" id="pane-wrap" role="tabpanel" aria-labelledby="tab-wrap" hidden>
        <h2>포장지</h2>
        <div class="papers" id="wraps"></div>
        <h2>리본</h2>
        <div class="ribbons" id="ribbons"></div>
      </section>

      <section class="pane" id="pane-card" role="tabpanel" aria-labelledby="tab-card" hidden>
        <div class="field"><label for="to">받는 사람</label><input id="to" maxlength="20" placeholder="엄마에게"></div>
        <div class="field"><label for="msg">한마디 <span class="len" id="msgLen"></span></label><textarea id="msg" maxlength="200" rows="4" placeholder="늘 고마워요"></textarea></div>
        <div class="field"><label for="from">보내는 사람</label><input id="from" maxlength="20" placeholder="막내가"></div>
      </section>

      <section class="pane" id="pane-saved" role="tabpanel" aria-labelledby="tab-saved" hidden>
        <div class="saved" id="saved"></div>
      </section>
    </div>

    <footer class="bar">
      <div class="tools">
        <button class="ghost" id="shuffle" type="button">다시 꽂기</button>
        <button class="ghost" id="random" type="button">추천 꽃다발</button>
        <button class="ghost" id="clear" type="button">비우기</button>
      </div>
      <button class="save" id="save" type="button">꽃다발 저장하기</button>
      <p class="status" id="status" role="status"></p>
      <div class="share" id="share" hidden>
        <input id="shareUrl" readonly aria-label="공유 링크">
        <button class="ghost" id="copy" type="button">복사</button>
      </div>
    </footer>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="js/flowers.js"></script>
<script src="js/app.js"></script>
</body>
</html>
