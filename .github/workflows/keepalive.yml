# saeip: Supabase 무료 프로젝트는 일주일 동안 요청이 없으면 일시 정지돼요.
# 사흘에 한 번 공개용 키로 기록 하나를 읽어서, 방문자가 없는 주에도 들판이 잠들지 않게 합니다.
# (공개용 키는 이미 config.js에 공개되어 있는 키라서 따로 비밀로 둘 필요가 없어요)
name: keep-alive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one clover
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://kddwszxlmdlkgskxmwgg.supabase.co/rest/v1/happies?select=id&limit=1" \
            -H "apikey: sb_publishable_UD4h3VkCUPhEbG8D5zLbxA_Qq18y5BY")
          echo "Supabase answered $code"
          test "$code" = 200
