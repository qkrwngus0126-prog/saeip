<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10초 세잎클로버 찾기 · saeip</title>
<!-- 릴스 녹화용 페이지라서 검색에는 나오지 않게 해요 -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050806">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='8 6 88 92'%3E%3Cstyle%3Esvg%7Bfill:%232f8a4f%3Bstroke:%232f8a4f%7D%40media (prefers-color-scheme:dark)%7Bsvg%7Bfill:%237fcf95%3Bstroke:%237fcf95%7D%7D%3C/style%3E%3Cpath d='M36.1 21.2A17 17 0 1 1 57.8 46.1L58.2 46.9A17 17 0 1 1 55.1 75.0M45.4 70.2A17 17 0 0 1 14.6 70.2M50 80Q51 89 57 95' fill='none' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23.5' cy='61' r='5.2'/%3E%3Ccircle cx='36.5' cy='61' r='5.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="challenge.css?v=1">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- 로고: 위와 오른쪽 잎을 이으면 3, 왼쪽 잎은 웃는 입 (index.html의 #mark와 같은 모양) -->
    <symbol id="mark" viewBox="8 6 88 92">
      <path d="M36.1 21.2A17 17 0 1 1 57.8 46.1L58.2 46.9A17 17 0 1 1 55.1 75.0M45.4 70.2A17 17 0 0 1 14.6 70.2M50 80Q51 89 57 95" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23.5" cy="61" r="4.3"/><circle cx="36.5" cy="61" r="4.3"/>
    </symbol>
  </defs>
</svg>

<!-- 녹화되는 화면: 1080x1920 기준으로 그리고, 창 크기에 맞춰 통째로 줄이거나 키워요 -->
<main class="stage" id="stage" data-phase="play">
  <canvas class="meadow" id="meadow" role="img" aria-label="네잎클로버 들판. 그 사이 어딘가에 세잎클로버가 하나 숨어 있습니다."></canvas>
  <div class="sky-light" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="answer" id="answer" hidden></div>

  <header class="hud">
    <span class="level" id="level-chip">LEVEL 1</span>
    <h1 class="title">네잎클로버 속 세잎클로버,<br>10초 안에 찾아보세요</h1>
    <div class="timer" id="timer" role="timer" aria-live="off">
      <b class="num" id="num">10</b>
      <span class="bar"><i id="bar"></i></span>
    </div>
  </header>

  <div class="cover" aria-hidden="true"></div>
  <section class="card ask" aria-live="polite">
    <p class="kicker">시간 끝!</p>
    <h2>찾았으면<br>댓글에 위치 남겨줘</h2>
    <p class="sub">예) 왼쪽 위, 가운데 아래</p>
  </section>
  <section class="card end" aria-live="polite">
    <svg class="end-mark" viewBox="0 0 20 20" aria-hidden="true"><use href="#mark"/></svg>
    <h2>네잎은 행운,<br>세잎은 행복</h2>
    <p class="sub">당신의 세잎클로버를 남겨주세요</p>
  </section>
</main>

<!-- 나만 보는 컨트롤 (녹화 전에 숨기기) -->
<aside class="panel" id="panel" aria-label="챌린지 컨트롤">
  <div class="panel-head">
    <b>세잎 챌린지</b>
    <button type="button" class="ghost" id="hide-btn" title="H">숨기기</button>
  </div>

  <button type="button" class="primary" id="start-btn" title="Space">시작</button>
  <button type="button" id="reset-btn" title="Esc">처음 화면으로</button>

  <div class="group">
    <span class="label">레벨 <small>(확대 정도)</small></span>
    <div class="seg" id="levels" role="group" aria-label="레벨">
      <button type="button" data-level="1" title="1">1 크게</button>
      <button type="button" data-level="2" title="2">2 중간</button>
      <button type="button" data-level="3" title="3">3 원래</button>
    </div>
  </div>

  <div class="group">
    <span class="label">배치</span>
    <button type="button" id="shuffle-btn" title="N">새로 섞기</button>
    <div class="seed-row">
      <span class="seed">시드 <b id="seed-now">-</b></span>
      <button type="button" class="ghost small" id="copy-btn">링크 복사</button>
    </div>
    <form class="seed-form" id="seed-form">
      <input id="seed-in" inputmode="numeric" pattern="[0-9]*" maxlength="9" placeholder="시드 번호" aria-label="시드 번호">
      <button type="submit">불러오기</button>
    </form>
  </div>

  <div class="group">
    <span class="label">정답 확인 <small>(녹화용 아님)</small></span>
    <button type="button" id="answer-btn" aria-pressed="false" title="A">정답 보기</button>
  </div>

  <div class="group">
    <span class="label">화면</span>
    <label class="row"><span>빛</span>
      <select id="light-sel">
        <option value="day">낮</option>
        <option value="dawn">새벽</option>
        <option value="dusk">해 질 녘</option>
        <option value="night">밤</option>
      </select>
    </label>
    <label class="row check"><input type="checkbox" id="chip-chk" checked> <span>레벨 표시</span></label>
  </div>

  <p class="help">Space 시작 · Esc 처음으로 · H 숨기기/보이기 · A 정답 · N 새로 섞기 · 1·2·3 레벨<br>
    숨긴 뒤에는 화면을 눌러도 시작돼요. 오른쪽 위 모서리를 누르거나 H를 누르면 다시 보여요.</p>
</aside>
<button type="button" class="unhide" id="unhide" aria-label="컨트롤 보이기" hidden></button>

<script src="js/challenge.js?v=1"></script>
</body>
</html>
